<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Gestionale Turni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8 max-w-5xl mx-auto">
    
    <!-- BARRA HEADER E LOGIN -->
    <div class="bg-gray-900 text-white p-5 rounded-xl shadow-lg mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
        <h2 id="header-business" class="text-2xl font-bold flex items-center gap-2">Gestionale Turni 🍔🛵</h2>
        
        <form id="form-login" class="flex flex-col md:flex-row gap-3 w-full md:w-auto">
            <select id="login-select" required class="text-gray-900 p-2 rounded-lg border-0 w-full md:w-auto font-medium">
                <option value="">-- Chi sei? --</option>
            </select>
            <input type="password" id="login-password" placeholder="Password" required class="text-gray-900 p-2 rounded-lg border-0 w-full md:w-auto">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 transition text-white px-5 py-2 rounded-lg font-bold w-full md:w-auto">Accedi</button>
        </form>

        <div id="user-info" class="hidden flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
            <span id="nome-loggato" class="text-lg font-medium"></span>
            <button onclick="eseguiLogout()" class="bg-red-500 hover:bg-red-600 transition px-4 py-2 rounded-lg font-bold w-full md:w-auto">Esci</button>
        </div>
    </div>
    
    <div id="contenuto-app" class="hidden space-y-6">
        
        <!-- SEZIONE MANAGER -->
        <div id="sezione-manager" class="hidden space-y-6">
            
            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-gray-900">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2">👑 Assegna un Nuovo Turno</h3>
                <form id="form-turno" class="flex flex-col md:flex-row gap-3 items-start md:items-center flex-wrap">
                    <input type="date" id="giorno" required class="border p-2 rounded-lg w-full md:w-auto outline-none">
                    <input type="text" id="orario" placeholder="es. 18:00 - 23:00" required class="border p-2 rounded-lg w-full md:w-auto outline-none">
                    <select id="selettore-dipendente" onchange="controllaReparto()" required class="border p-2 rounded-lg w-full md:w-auto outline-none">
                        <option value="">-- Scegli dipendente --</option>
                    </select>
                    <select id="selettore-veicolo" class="hidden border p-2 rounded-lg w-full md:w-auto outline-none bg-yellow-50 border-yellow-400">
                        <option value="">-- Nessun Mezzo --</option>
                    </select>
                    <select id="settimane-ricorrenza" class="border p-2 rounded-lg w-full md:w-auto outline-none bg-blue-50 border-blue-300 font-semibold text-blue-900">
                        <option value="1">Singolo Turno</option>
                        <option value="2">🔄 Ripeti per 2 settimane</option>
                        <option value="4">🔄 Ripeti per 4 settimane (1 mese)</option>
                    </select>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 transition text-white px-6 py-2 rounded-lg font-bold w-full md:w-auto">Salva Turno</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md border-t-4 border-indigo-600">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
                    <h3 class="text-xl font-bold text-gray-900">📊 Resoconto Mensile Turni Assegnati</h3>
                    <input type="month" id="selettore-mese-stats" onchange="caricaStatisticheMensili()" class="border p-2 rounded-lg text-sm bg-gray-50 outline-none font-bold text-indigo-700">
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3">Dipendente</th>
                            <th class="p-3">Reparto</th>
                            <th class="p-3 text-right">Totale Turni</th>
                        </tr>
                    </thead>
                    <tbody id="tabella-statistiche"></tbody>
                </table>
            </div>

        </div>

        <!-- NUOVA SEZIONE STAFF (PROPOSTA TURNI) -->
        <div id="sezione-staff" class="hidden bg-white p-6 rounded-xl shadow-md border-t-4 border-green-600">
            <h3 class="text-xl font-bold mb-2 flex items-center gap-2">✋ Proponi una tua Disponibilità</h3>
            <p class="text-sm text-gray-500 mb-4">Invia al manager una proposta per un turno in cui sei disponibile a lavorare.</p>
            <form id="form-proponi-turno" class="flex flex-col md:flex-row gap-3 items-start md:items-center flex-wrap">
                <input type="date" id="giorno-proposta" required class="border p-2 rounded-lg w-full md:w-auto outline-none focus:ring-2 focus:ring-green-500">
                <input type="text" id="orario-proposta" placeholder="es. 18:00 - 23:00" required class="border p-2 rounded-lg w-full md:w-auto outline-none focus:ring-2 focus:ring-green-500">
                <button type="submit" class="bg-green-500 hover:bg-green-600 transition text-white px-6 py-2 rounded-lg font-bold w-full md:w-auto shadow-sm">Invia Proposta</button>
            </form>
        </div>

        <!-- BACHECA TURNI (VISIBILE A TUTTI) -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b">
                <h3 class="text-xl font-bold">📅 Bacheca e Gestione Turni</h3>
                <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                    <select id="filtro-reparto" onchange="caricaTurni()" class="border p-2 rounded-lg text-sm bg-gray-50 outline-none">
                        <option value="Tutti">🔍 Tutti i Reparti</option>
                    </select>
                    <label class="flex items-center gap-2 text-sm font-semibold cursor-pointer bg-gray-100 px-3 py-2 rounded-lg hover:bg-gray-200 transition">
                        <input type="checkbox" id="filtro-miei" onchange="caricaTurni()" class="rounded text-blue-600"> 👤 Solo i miei turni
                    </label>
                </div>
            </div>
            <div id="lista-turni" class="flex flex-col gap-4"></div>
        </div>
    </div>

    <script>
        let utenteLoggato = null; 
        let listaUtentiGlobal = [];
        let listaVeicoliGlobal = [];
        let listaRepartiGlobal = [];

        const oggi = new Date();
        document.getElementById('selettore-mese-stats').value = `${oggi.getFullYear()}-${String(oggi.getMonth() + 1).padStart(2, '0')}`;

        function caricaImpostazioni() {
            return fetch('/api/impostazioni').then(res => res.json()).then(data => {
                const titolo = `${data.nome_business || 'Gestionale Turni'} ${data.emoji_business || ''}`;
                document.getElementById('header-business').textContent = titolo;
                document.getElementById('page-title').textContent = titolo;
            });
        }

        function caricaReparti() {
            return fetch('/api/reparti').then(res => res.json()).then(reparti => {
                listaRepartiGlobal = reparti;
                const filtroReparto = document.getElementById('filtro-reparto');
                filtroReparto.innerHTML = '<option value="Tutti">🔍 Tutti i Reparti</option>';
                reparti.forEach(r => {
                    const optionFiltro = document.createElement('option');
                    optionFiltro.value = r.nome;
                    optionFiltro.textContent = `Reparto: ${r.nome}`;
                    filtroReparto.appendChild(optionFiltro);
                });
            });
        }

        function caricaUtenti() {
            return fetch('/api/utenti').then(res => res.json()).then(utenti => {
                listaUtentiGlobal = utenti;
                const loginSelect = document.getElementById('login-select');
                const selettoreDipendente = document.getElementById('selettore-dipendente');
                
                loginSelect.innerHTML = '<option value="">-- Chi sei? --</option>';
                selettoreDipendente.innerHTML = '<option value="">-- Scegli dipendente --</option>';

                utenti.forEach(utente => {
                    const optionLogin = document.createElement('option');
                    optionLogin.value = utente.id;
                    optionLogin.textContent = utente.nome;
                    loginSelect.appendChild(optionLogin);

                    if(utente.ruolo !== 'manager') {
                        const optionTurno = document.createElement('option');
                        optionTurno.value = utente.id;
                        const repartoObj = listaRepartiGlobal.find(r => r.nome === utente.reparto);
                        optionTurno.dataset.richiedeVeicolo = (repartoObj && repartoObj.richiede_veicolo) ? "1" : "0";
                        optionTurno.dataset.reparto = utente.reparto;
                        optionTurno.textContent = `${utente.nome} (${utente.reparto})`;
                        selettoreDipendente.appendChild(optionTurno);
                    }
                });
            });
        }

        function caricaVeicoli() {
            return fetch('/api/veicoli').then(res => res.json()).then(veicoli => {
                listaVeicoliGlobal = veicoli;
                const selettoreVeicolo = document.getElementById('selettore-veicolo');
                selettoreVeicolo.innerHTML = '<option value="">-- Nessun Mezzo/Risorsa --</option>';
                veicoli.forEach(v => {
                    const option = document.createElement('option');
                    option.value = v.id;
                    option.textContent = `🚗 ${v.nome} (${v.tipo})`;
                    selettoreVeicolo.appendChild(option);
                });
            });
        }

        function caricaStatisticheMensili() {
            const mese = document.getElementById('selettore-mese-stats').value;
            if(!mese) return;
            fetch(`/api/statistiche/mensili?mese=${mese}`).then(res => res.json()).then(stats => {
                const tbody = document.getElementById('tabella-statistiche');
                tbody.innerHTML = '';
                stats.forEach(s => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-gray-50";
                    tr.innerHTML = `<td class="p-3 font-bold">${s.nome}</td><td class="p-3 text-sm text-gray-600">${s.reparto}</td><td class="p-3 text-right"><span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-3 py-1.5 rounded-full">${s.totale_turni} turni</span></td>`;
                    tbody.appendChild(tr);
                });
            });
        }

        caricaImpostazioni();
        caricaReparti().then(() => { caricaUtenti(); caricaVeicoli(); });

        document.getElementById('form-login').addEventListener('submit', function(event) {
            event.preventDefault();
            const idUtente = document.getElementById('login-select').value;
            const password = document.getElementById('login-password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ utente_id: idUtente, password: password })
            }).then(res => res.json()).then(data => {
                if (data.success) {
                    utenteLoggato = data.utente;
                    
                    document.getElementById('form-login').classList.add('hidden');
                    document.getElementById('user-info').classList.remove('hidden');
                    document.getElementById('nome-loggato').innerHTML = `Ciao, <strong>${utenteLoggato.nome}</strong>`;
                    document.getElementById('contenuto-app').classList.remove('hidden');
                    
                    if(utenteLoggato.ruolo === 'manager') {
                        document.getElementById('sezione-manager').classList.remove('hidden');
                        document.getElementById('sezione-staff').classList.add('hidden');
                        caricaStatisticheMensili();
                    } else {
                        document.getElementById('sezione-manager').classList.add('hidden');
                        document.getElementById('sezione-staff').classList.remove('hidden');
                    }
                    
                    document.getElementById('login-password').value = '';
                    caricaTurni();
                } else {
                    alert(data.message);
                }
            });
        });

        window.eseguiLogout = function() {
            utenteLoggato = null;
            document.getElementById('form-login').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('contenuto-app').classList.add('hidden');
            document.getElementById('sezione-manager').classList.add('hidden');
            document.getElementById('sezione-staff').classList.add('hidden');
            document.getElementById('login-select').value = '';
        };

        window.controllaReparto = function() {
            const selettore = document.getElementById('selettore-dipendente');
            const tendinaVeicolo = document.getElementById('selettore-veicolo');
            if(selettore.selectedIndex > 0) {
                const richiedeVeicolo = selettore.options[selettore.selectedIndex].dataset.richiedeVeicolo;
                if (richiedeVeicolo === "1") tendinaVeicolo.classList.remove('hidden');
                else { tendinaVeicolo.classList.add('hidden'); tendinaVeicolo.value = ''; }
            }
        };

        window.aggiornaVeicoloTurno = function(idTurno, idVeicolo) {
            fetch(`/api/turni/${idTurno}/veicolo`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ veicolo_id: idVeicolo || null })
            }).then(() => caricaTurni());
        };

        function caricaTurni() {
            if (!utenteLoggato) return;
            const filtroRepartoVal = document.getElementById('filtro-reparto').value;
            const soloMiei = document.getElementById('filtro-miei').checked;

            fetch('/api/turni').then(res => res.json()).then(turni => {
                const lista = document.getElementById('lista-turni');
                lista.innerHTML = ''; 
                
                const turniFiltrati = turni.filter(turno => {
                    const matchReparto = (filtroRepartoVal === "Tutti" || turno.reparto === filtroRepartoVal);
                    const matchMiei = (!soloMiei || turno.utente_id === utenteLoggato.id || turno.sostituto_id === utenteLoggato.id);
                    return matchReparto && matchMiei;
                });

                turniFiltrati.forEach(turno => {
                    const div = document.createElement('div');
                    let colorClass = "";
                    if (turno.stato === 'assegnato') colorClass = "border-blue-500 bg-blue-50";
                    else if (turno.stato === 'in_scambio') colorClass = "border-orange-500 bg-orange-50";
                    else if (turno.stato === 'in_approvazione') colorClass = "border-pink-500 bg-pink-50";
                    else if (turno.stato === 'proposto') colorClass = "border-teal-500 bg-teal-50"; // Nuova colorazione per proposte

                    div.className = `p-4 rounded-lg border-l-4 ${colorClass} flex flex-col md:flex-row justify-between items-start md:items-center gap-4 shadow-sm`;
                    
                    const info = document.createElement('div');
                    let testoTurno = `<div class="text-lg mb-1"><span class="font-black">${turno.giorno}</span> <span class="text-gray-600">(${turno.orario})</span></div> 
                                      <div class="text-gray-800">👤 <strong>${turno.nome_proprietario}</strong> <span class="text-sm text-gray-500">(${turno.reparto})</span></div>`;
                    
                    if (utenteLoggato.ruolo === 'manager' && turno.stato !== 'proposto') {
                        let selectVeicoloHtml = `<div class="mt-2 text-sm flex items-center gap-2">🛵 Mezzo: <select onchange="aggiornaVeicoloTurno(${turno.id}, this.value)" class="text-xs p-1 border rounded bg-white"><option value="">-- Nessuno --</option>`;
                        listaVeicoliGlobal.forEach(v => {
                            const isSelected = turno.veicolo_id === v.id ? 'selected' : '';
                            selectVeicoloHtml += `<option value="${v.id}" ${isSelected}>${v.nome} (${v.tipo})</option>`;
                        });
                        selectVeicoloHtml += `</select></div>`;
                        testoTurno += selectVeicoloHtml;
                    } else if(turno.nome_veicolo) {
                        testoTurno += `<div class="text-gray-800 mt-1">🛵 Mezzo: <strong>${turno.nome_veicolo}</strong></div>`;
                    }
                    
                    if (turno.stato === 'in_approvazione') testoTurno += `<div class="mt-2 text-pink-700 text-sm font-semibold">⚠️ ${turno.nome_sostituto} si propone per scambiare!</div>`;
                    else if (turno.stato === 'proposto') testoTurno += `<div class="mt-2 text-teal-700 text-sm font-bold">✋ Turno proposto in attesa di approvazione</div>`;
                    else testoTurno += `<div class="mt-2 text-gray-500 text-xs uppercase tracking-wider font-bold">Stato: ${turno.stato.replace('_', ' ')}</div>`;
                    
                    info.innerHTML = testoTurno;
                    
                    const bloccoBottoni = document.createElement('div');
                    bloccoBottoni.className = "flex flex-wrap w-full md:w-auto gap-2 mt-2 md:mt-0";
                    
                    if (utenteLoggato.ruolo === 'manager') {
                        if (turno.stato === 'in_approvazione') {
                            bloccoBottoni.innerHTML += `<button class="bg-green-500 hover:bg-green-600 text-white px-3 py-1.5 rounded font-bold text-sm shadow-sm" onclick="approvaScambio(${turno.id})">✅ Approva</button> 
                                                        <button class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded font-bold text-sm shadow-sm" onclick="cambiaStato(${turno.id}, 'assegnato')">❌ Rifiuta</button>`;
                        } else if (turno.stato === 'proposto') {
                            bloccoBottoni.innerHTML += `<button class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded font-bold text-sm shadow-sm" onclick="cambiaStato(${turno.id}, 'assegnato')">✅ Approva Proposta</button>`;
                        }
                        // Il manager può sempre eliminare qualsiasi turno
                        bloccoBottoni.innerHTML += `<button class="bg-gray-800 hover:bg-black text-white px-3 py-1.5 rounded font-bold text-sm shadow-sm ml-auto" onclick="eliminaTurno(${turno.id})">🗑️ Elimina</button>`;
                    } else {
                        if (turno.stato === 'assegnato' && turno.utente_id === utenteLoggato.id) {
                            bloccoBottoni.innerHTML = `<button class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg font-bold shadow-sm" onclick="cambiaStato(${turno.id}, 'in_scambio')">🔄 Cedi Turno</button>`;
                        } else if (turno.stato === 'in_scambio' && turno.utente_id !== utenteLoggato.id) {
                            bloccoBottoni.innerHTML = `<button class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg font-bold shadow-sm" onclick="inviaProposta(${turno.id})">✋ Mi Propongo</button>`;
                        } else if (turno.stato === 'proposto' && turno.utente_id === utenteLoggato.id) {
                            bloccoBottoni.innerHTML = `<button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-bold shadow-sm" onclick="eliminaTurno(${turno.id})">Annulla Proposta</button>`;
                        }
                    }

                    div.appendChild(info);
                    if(bloccoBottoni.innerHTML !== "") div.appendChild(bloccoBottoni);
                    lista.appendChild(div);
                });
            });
        }

        // SALVATAGGIO TURNI DA PARTE DEL MANAGER
        document.getElementById('form-turno').addEventListener('submit', function(event) {
            event.preventDefault();
            const selettore = document.getElementById('selettore-dipendente');
            if(selettore.selectedIndex <= 0) return alert("Seleziona un dipendente.");
            
            const nuovoTurno = {
                giorno: document.getElementById('giorno').value,
                orario: document.getElementById('orario').value,
                utente_id: selettore.value,
                reparto: selettore.options[selettore.selectedIndex].dataset.reparto,
                veicolo_id: document.getElementById('selettore-veicolo').value || null,
                settimane: document.getElementById('settimane-ricorrenza').value,
                stato: 'assegnato' // Il manager assegna direttamente
            };

            fetch('/api/turni', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(nuovoTurno) }).then(() => {
                caricaTurni();
                if(utenteLoggato?.ruolo === 'manager') caricaStatisticheMensili();
                document.getElementById('form-turno').reset(); 
                document.getElementById('selettore-veicolo').classList.add('hidden');
            });
        });

        // SALVATAGGIO TURNI DA PARTE DELLO STAFF (PROPOSTA)
        document.getElementById('form-proponi-turno').addEventListener('submit', function(event) {
            event.preventDefault();
            const turnoProposto = {
                giorno: document.getElementById('giorno-proposta').value,
                orario: document.getElementById('orario-proposta').value,
                utente_id: utenteLoggato.id,
                reparto: utenteLoggato.reparto,
                veicolo_id: null,
                settimane: 1,
                stato: 'proposto' // Lo staff invia solo proposte
            };

            fetch('/api/turni', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(turnoProposto) }).then(() => {
                caricaTurni();
                document.getElementById('form-proponi-turno').reset(); 
            });
        });

        window.cambiaStato = function(idTurno, nuovoStato) { 
            fetch(`/api/turni/${idTurno}/stato`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stato: nuovoStato }) })
            .then(() => { caricaTurni(); if(utenteLoggato?.ruolo === 'manager') caricaStatisticheMensili(); }); 
        };
        
        window.inviaProposta = function(idTurno) { fetch(`/api/turni/${idTurno}/proponi`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sostituto_id: utenteLoggato.id }) }).then(() => caricaTurni()); };
        
        window.approvaScambio = function(idTurno) { 
            fetch(`/api/turni/${idTurno}/approva`, { method: 'PUT' }).then(() => { caricaTurni(); if(utenteLoggato?.ruolo === 'manager') caricaStatisticheMensili(); }); 
        };

        // FUNZIONE PER ELIMINARE DEFINITIVAMENTE UN TURNO
        window.eliminaTurno = function(idTurno) {
            if(confirm("Sei sicuro di voler eliminare questo turno definitivamente?")) {
                fetch(`/api/turni/${idTurno}`, { method: 'DELETE' }).then(() => {
                    caricaTurni();
                    if(utenteLoggato?.ruolo === 'manager') caricaStatisticheMensili();
                });
            }
        };
    </script>
</body>
</html>
